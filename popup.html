<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naukri Job Blocker Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2.5" fill="none">
            <circle cx="12" cy="12" r="10"/>
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>Naukri Blocker</h1>
          <p>Remove spam & generic job listings</p>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
      <!-- Input Panel -->
      <section class="control-panel">
        <form id="add-form" class="add-form">
          <div class="input-group">
            <input 
              type="text" 
              id="company-input" 
              placeholder="Enter company name (e.g. Accenture)" 
              autocomplete="off"
              required
            >
            <button type="submit" class="btn-add">
              <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              <span>Block</span>
            </button>
          </div>
        </form>
      </section>

      <!-- Blocklist Section -->
      <section class="list-section">
        <div class="list-header">
          <h2>Blocked Companies</h2>
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" class="search-icon">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="search-input" placeholder="Search blocklist...">
          </div>
        </div>

        <div class="list-container" id="blocklist-container">
          <!-- Dynamically populated -->
          <div class="loading-state">
            <div class="spinner"></div>
            <span>Loading your list...</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Footer / Stats -->
    <footer class="app-footer">
      <div class="stats-bar">
        <span class="stat-item">
          <span class="stat-label">Total Blocked:</span>
          <span class="stat-value" id="total-count">0</span>
        </span>
      </div>
      <div class="help-text">
        Tip: You can block companies with one click using the <span class="badge">🚫 Block</span> button injected next to names on Naukri.com.
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
